[project]
name = "api"
version = "0.0.1"
description = "FastAPI backend for NotToBeCooked monorepo"
requires-python = ">=3.11"
dependencies = [
    "python-multipart>=0.0.20",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "email-validator>=2.3.0",
    "sqlmodel>=0.0.39",
    "asyncpg>=0.31.0",
    "pgvector>=0.3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "docling>=2.117.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "sentence-transformers>=5.7.0",
    "kernels>=0.16.0",
    "httpx>=0.28.1",
    "alembic>=1.19.1",
    # Required by the jina embedding model's own custom_st.py, not by our code,
    # which is why it was never declared. AI-2 hit the same requirement
    # independently on his branch (f60b48b) when he needed the model's tokenizer
    # for token counting -- both branches added this exact line, in different
    # positions, and merging them conflicted. One line survives.
    "peft>=0.20.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which shift between
# releases and would silently change what the gate enforces.
#   E4/E7/E9 imports, statements, syntax   F  pyflakes
#   I        import sorting                UP pyupgrade
#   B        bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

# Baseline, not a permanent exemption. Every rule below fires only inside the
# auth modules, which AI-1 owns, and every one of them changes how an exception
# is raised or caught -- a judgement call about someone else's error handling,
# not a mechanical fix. Enabling them is a separate conversation with AI-1:
#
#   B904   7x  raise HTTPException inside except without `from None` / `from err`
#   BLE001 1x  except Exception around argon2 verify, hiding non-password failures
#
# TRY002 was on this list too -- 2x bare `raise Exception`, both inside
# verify_token(), which had no callers anywhere in the repo. The function was
# deleted on 15 Aug 2026 rather than fixed, so the exemption went with it.
#
# Remove these once AI-1 has taken a view. Nothing else in the backend is exempt.
ignore = ["B904"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags FastAPI's required idiom -- `x = Depends(get_session)` in a default
# argument is how dependency injection is declared, not an accidental call at
# import time. Without these exemptions the rule fires on every route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Cookie",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]
